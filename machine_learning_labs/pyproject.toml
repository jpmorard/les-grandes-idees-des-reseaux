[project]
name = "network-book-machine-learning-labs"
version = "1.0.0"
description = "Reproducible ML and reinforcement-learning laboratories for the network book"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gymnasium==1.2.3",
    "jupyter>=1.1,<2",
    "matplotlib>=3.10,<4",
    "numpy==2.4.6",
    "pandas>=2.3,<4",
    "torch==2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
